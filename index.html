<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Responsive Menu</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A hands-on repository dedicated to mastering CSS Flexbox fundamentals and building responsive navigation systems from scratch.">
        <meta name="keywords" content="css, css3, responsive menu, flex, flexbox">
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <header>
            <nav class="navBar" aria-label="Main Navigation">
                <input type="checkbox" id="menu-toggle" class="menuToggle" aria-label="Toggle navigation menu">
                <label for="menu-toggle" class="hamburger" aria-hidden="true">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </label>
                <ul class="menuItems">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main></main>
        <footer></footer>
    </body>
</html>
